<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Didi Fluxo Bot — Terminal de Sinais</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root{color-scheme:dark;
      --bg:#0c0a18;
      --panel:#1a1530;
      --panel-light:#241c42;
      --line:#433878;
      --muted:#a8a3c2;
      --cyan-neon:#00f0ff;
      --purple-primary:#7c3aed;
      --purple-light:#a78bfa;
      --purple-dark:#2e1b56;
      --green:#34d399;
      --red:#fb7185;
      --gold:#fbbf24}
    *{box-sizing:border-box} 
    body{margin:0;background:radial-gradient(ellipse at top,#201840 0,#0c0a18 55%);color:#e9e5ff;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .panel{background:linear-gradient(145deg,rgba(42,32,75,.92),rgba(22,16,45,.94));border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(167,139,250,.08)}
    .muted{color:var(--muted)} 
    .field{width:100%;background:#151029;border:1px solid #433878;border-radius:9px;padding:10px 12px;color:#e9e5ff;outline:none;transition:.15s}
    .field:focus{border-color:var(--cyan-neon);box-shadow:0 0 0 2px rgba(0,240,255,.15), 0 0 12px rgba(0,240,255,.15)} 
    .btn{border-radius:9px;padding:10px 14px;font-weight:700;transition:.15s;position:relative;overflow:hidden}
    .btn-primary{background:linear-gradient(90deg,#4f46e5,#06b6d4);color:#ffffff;box-shadow:0 0 12px rgba(79,70,229,.25)}
    .btn-primary:hover{box-shadow:0 0 18px rgba(0,240,255,.35)}
    .btn-primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
    .btn-secondary{background:linear-gradient(145deg,#2a2150,#1e183c);border:1px solid #524591;color:#d4ccff}
    .btn-secondary:hover{border-color:var(--purple-light);background:linear-gradient(145deg,#352966,#251d4a)}
    .btn-danger{background:linear-gradient(145deg,#5c1e2f,#3f1421);border:1px solid #86354c;color:#ffd4dc}
    .pill{border:1px solid #433878;background:#1e1738;border-radius:999px;padding:4px 9px;font-size:11px}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#646085}.dot.ok{background:#00f0ff;box-shadow:0 0 8px #00f0ff}.dot.bad{background:#fb7185;box-shadow:0 0 6px #fb718580}
    .signal-call{color:#00f0ff; text-shadow:0 0 4px rgba(0,240,255,.3)}.signal-put{color:#fb7185; text-shadow:0 0 4px rgba(251,113,133,.3)}
    .row-hover:hover{background:#2a2050}.hidden{display:none!important}
    .table-wrap{overflow:auto} table{width:100%;border-collapse:collapse;white-space:nowrap} th,td{padding:10px 12px;border-bottom:1px solid #382f63;text-align:left;font-size:12px} th{color:#b4a9e6;font-weight:600}
    .skeleton{color:#867fb0;font-style:italic}.metric{font-variant-numeric:tabular-nums}
    input[type=range]{accent-color:#00f0ff}
    .text-cyan-300{color:#00f0ff}
    .bg-cyan-400\/10{background:rgba(0,240,255,.08)}
    .border-cyan-300\/30{border-color:rgba(0,240,255,.2)}
    .bg-slate-950\/60{background:rgba(21,16,48,.6)}
    .border-slate-700\/70{border-color:rgba(82,73,128,.7)}
    .border-slate-700{border-color:#433878}
    .text-emerald-300{color:#34ffa8}
    .text-amber-300{color:#ffd166}
    .text-rose-300{color:#ff8fa3}
    .border-t{border-top-width:1px}
    @media(max-width:900px){.dashboard-grid{grid-template-columns:1fr!important}.header-wrap{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <section id="auth-panel" class="min-h-screen flex items-center justify-center p-4">
    <div class="panel p-6 w-full max-w-md">
      <div class="text-xl font-black mb-1">DIDI FLUXO <span class="text-cyan-300">BOT</span></div>
      <p class="muted text-sm mb-5">Entre na sua conta.</p>
      <form id="auth-form" class="space-y-3">
        <div id="auth-name-wrap" class="hidden"><label class="text-xs muted">Nome</label><input id="auth-name" class="field mt-1" maxlength="80"></div>
        <div><label class="text-xs muted">E-mail</label><input id="auth-email" class="field mt-1" type="email" required autocomplete="username"></div>
        <div><label class="text-xs muted">Senha</label><input id="auth-password" class="field mt-1" type="password" required minlength="6" autocomplete="current-password"></div>
        <button id="auth-submit" class="btn btn-primary w-full" type="submit">Entrar</button>
      </form>
      <button id="auth-toggle" class="text-cyan-300 text-sm mt-4" type="button">Criar uma conta</button>
      <p id="auth-message" class="text-xs muted mt-3" aria-live="polite"></p>
    </div>
  </section>
  <main id="dashboard" class="min-h-screen p-3 md:p-5 hidden">
    <header class="header-wrap flex justify-between gap-4 mb-5">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-cyan-400/10 border border-cyan-300/30 flex items-center justify-center text-cyan-300"><i data-lucide="activity"></i></div>
        <div><h1 class="text-xl md:text-2xl font-black">DIDI FLUXO <span class="text-cyan-300">BOT</span></h1><div class="text-xs muted">Dados fornecidos pela API da aplicação</div></div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <span class="pill flex items-center gap-2"><span id="api-dot" class="dot"></span><span id="api-status">API aguardando</span></span>
        <span class="pill flex items-center gap-2"><span id="broker-dot" class="dot"></span><span id="broker-status">Corretora desconectada</span></span><button id="logout" class="btn btn-secondary text-xs" type="button">Sair</button>
      </div>
    </header>

    <section class="grid dashboard-grid grid-cols-1 lg:grid-cols-[300px_minmax(0,1fr)_310px] gap-4">
      <aside class="space-y-4">
        <div class="panel p-4">
          <h2 class="font-bold mb-3 flex items-center gap-2"><i data-lucide="plug" class="w-4 text-cyan-300"></i> Conexão da corretora</h2>
          <form id="broker-form" class="space-y-3">
            <div><label class="text-xs muted">Corretora</label><select id="broker-name" class="field mt-1"><option value="iqoption">IQ Option</option><option value="polarium">Polarium</option></select></div>
            <div><label class="text-xs muted">E-mail da corretora</label><input id="broker-email" class="field mt-1" type="email" autocomplete="off" required></div>
            <div><label class="text-xs muted">Senha da corretora</label><input id="broker-password" class="field mt-1" type="password" autocomplete="new-password" required></div>
            <div><label class="text-xs muted">Conta</label><select id="account-type" class="field mt-1"><option value="demo">Demo</option><option value="real">Real</option></select></div>
            <button id="broker-connect" class="btn btn-primary w-full" type="submit">Conectar</button>
            <button id="broker-disconnect" class="btn btn-secondary w-full hidden" type="button">Desconectar</button>
          </form>
          <p id="broker-message" class="text-xs muted mt-3" aria-live="polite">Aguardando conexão confirmada pelo servidor.</p>
        </div>
        <div class="panel p-4">
          <h2 class="font-bold mb-3 flex items-center gap-2"><i data-lucide="sliders-horizontal" class="w-4 text-cyan-300"></i> Parâmetros do scanner</h2>
          <div class="mb-3"><label class="text-xs muted">Tempo gráfico</label><select id="timeframe" class="field mt-1"><option value="M1">M1</option><option value="M5" selected>M5</option><option value="M15">M15</option></select></div>
          <div class="mb-2 flex justify-between text-xs"><label for="confidence">Confiança mínima</label><strong id="confidence-label">70%</strong></div>
          <div class="rounded-xl bg-slate-950/60 p-3 mt-3"><div class="text-xs muted">Contagem regressiva da vela atual</div><div id="candle-countdown" class="text-2xl font-black mt-1">--:--</div><div id="candle-countdown-note" class="text-xs muted mt-1">Aguardando
