  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0616;
      --panel: rgba(24, 13, 44, 0.78);
      --line: rgba(255, 77, 166, 0.2);
      --muted: #b39ddb;
      --pink: #ff3e9c;
      --sunset: #ff8e53;
      --cyan: #00f0ff;
      --green: #00f5a0;
      --red: #ff3b6b;
      --gold: #ffcc33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: #f8f2ff;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 62, 156, 0.26) 0%, transparent 38%),
        radial-gradient(circle at 88% 15%, rgba(0, 240, 255, 0.18) 0%, transparent 36%),
        radial-gradient(circle at 50% 95%, rgba(255, 142, 83, 0.14) 0%, transparent 45%),
        linear-gradient(145deg, #0b0616 0%, #170b2e 50%, #090c1d 100%);
      background-attachment: fixed;
    }

    /* Painéis estilo Glassmorphism Vice City */
    .panel {
      background: linear-gradient(155deg, rgba(33, 17, 58, 0.85), rgba(15, 11, 32, 0.92));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .muted { color: var(--muted); }

    /* Campos de entrada */
    .field {
      width: 100%;
      background: rgba(13, 8, 28, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 10px;
      padding: 10px 12px;
      color: #f8f2ff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(255, 62, 156, 0.18);
    }

    /* Botões */
    .btn {
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.15s ease;
      cursor: pointer;
    }
    .btn:active:not(:disabled) { transform: scale(0.98); }

    .btn-primary {
      background: linear-gradient(90deg, #ff3e9c 0%, #9b51e0 55%, #ff8e53 100%);
      background-size: 160% auto;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      box-shadow: 0 4px 18px rgba(255, 62, 156, 0.32);
    }
    .btn-primary:hover:not(:disabled) {
      background-position: right center;
      box-shadow: 0 6px 24px rgba(255, 62, 156, 0.5);
    }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

    .btn-secondary {
      background: rgba(45, 24, 74, 0.85);
      border: 1px solid rgba(255, 77, 166, 0.25);
      color: #f3e8ff;
    }
    .btn-secondary:hover:not(:disabled) {
      background: rgba(64, 34, 102, 0.95);
      border-color: rgba(255, 77, 166, 0.5);
    }
    .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-danger {
      background: linear-gradient(90deg, #7f1d45, #be185d);
      border: 1px solid rgba(255, 59, 107, 0.45);
      color: #ffe4e6;
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.25);
    }

    /* Badges e Status */
    .pill {
      border: 1px solid rgba(0, 240, 255, 0.25);
      background: rgba(18, 12, 38, 0.85);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #7e699c; }
    .dot.ok { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .dot.bad { background: var(--red); box-shadow: 0 0 10px var(--red); }

    /* Direções de Sinal */
    .signal-call { color: var(--green); text-shadow: 0 0 12px rgba(0, 245, 160, 0.35); }
    .signal-put { color: var(--red); text-shadow: 0 0 12px rgba(255, 59, 107, 0.35); }
    .signal-neutral { color: var(--gold); }

    /* Listas e Tabelas */
    .row-hover { transition: background 0.15s, border-color 0.15s; }
    .row-hover:hover {
      background: rgba(255, 62, 156, 0.12);
      border-color: rgba(255, 62, 156, 0.45) !important;
    }
    .hidden { display: none !important; }

    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td { padding: 10px 12px; border-bottom: 1px solid rgba(255, 77, 166, 0.14); text-align: left; font-size: 12px; }
    th { color: #d8b4fe; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.04em; }

    .skeleton { color: #957dad; font-style: italic; }
    .metric { font-variant-numeric: tabular-nums; }
    input[type=range] { accent-color: var(--pink); }

    /* Adaptação automática das classes Tailwind antigas para o tema Vice City */
    .text-cyan-300 {
      background: linear-gradient(90deg, #ff3e9c, #ff9e44);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .bg-cyan-400\/10 {
      background-color: rgba(255, 62, 156, 0.14) !important;
      border-color: rgba(255, 62, 156, 0.38) !important;
    }
    .bg-cyan-400\/10 svg { color: #ff3e9c; }
    .bg-slate-950\/60 { background-color: rgba(14, 9, 30, 0.75) !important; border: 1px solid rgba(255, 255, 255, 0.05); }
    .bg-slate-950\/50 { background-color: rgba(14, 9, 30, 0.65) !important; }
    .border-slate-700, .border-slate-700\/70 { border-color: rgba(255, 77, 166, 0.2) !important; }

    /* Contagem regressiva e saldo com destaque neon suave */
    #candle-countdown {
      color: var(--cyan);
      text-shadow: 0 0 14px rgba(0, 240, 255, 0.35);
    }

    @media (max-width: 900px) {
      .dashboard-grid { grid-template-columns: 1fr !important; }
      .header-wrap { align-items: flex-start; flex-direction: column; }
    }
  </style>
