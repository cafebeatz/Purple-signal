<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Purple Signal — Trading Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root{color-scheme:dark;--bg:#10071b;--panel:#1a1028;--line:#493064;--muted:#b8a8ca;--cyan:#d8a7ff;--green:#34d399;--red:#fb7185;--gold:#fbbf24}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(ellipse at 50% -15%,#54217b 0,transparent 48%),linear-gradient(145deg,#10071b,#160d24 55%,#0b0712);color:#f4eaff;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .panel{background:linear-gradient(145deg,rgba(39,22,58,.96),rgba(20,12,32,.97));border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 35px #0007}
    .muted{color:var(--muted)} .field{width:100%;background:#080e18;border:1px solid #2a3950;border-radius:9px;padding:10px 12px;color:#e5edf8;outline:none}
    .field:focus{border-color:#c084fc;box-shadow:0 0 0 2px #a855f733} .btn{border-radius:9px;padding:10px 14px;font-weight:700;transition:.15s}
    .btn-primary{background:linear-gradient(100deg,#8b35c9,#c04dff);color:#fff;box-shadow:0 0 18px #a33de344}.btn-primary:disabled{opacity:.45;cursor:not-allowed}
    .btn-secondary{background:#1b293b;border:1px solid #33445c;color:#dce8f8}.btn-danger{background:#4a1f2a;border:1px solid #713344;color:#fecdd3}
    .pill{border:1px solid #33445c;background:#111c2b;border-radius:999px;padding:4px 9px;font-size:11px}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#64748b}.dot.ok{background:#34d399;box-shadow:0 0 10px #34d39988}.dot.bad{background:#fb7185}
    .signal-call{color:#34d399}.signal-put{color:#fb7185}.signal-neutral{color:#fbbf24}
    .row-hover:hover{background:#172438}.hidden{display:none!important}
    .table-wrap{overflow:auto} table{width:100%;border-collapse:collapse;white-space:nowrap} th,td{padding:10px 12px;border-bottom:1px solid #253247;text-align:left;font-size:12px} th{color:#91a3bb;font-weight:600}
    .skeleton{color:#74849a;font-style:italic}.metric{font-variant-numeric:tabular-nums}
    input[type=range]{accent-color:#c084fc}
    .brand-mark{background:linear-gradient(135deg,#6d28a8,#c026d3)!important;color:white!important;border-color:#d8b4fe!important;box-shadow:0 0 24px #a855f755}
    .tabbar{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 14px;scrollbar-width:thin}
    .tab-button{flex:0 0 auto;border:1px solid #64427d;background:#211331;color:#d9c5ec;border-radius:12px;padding:11px 15px;font-size:13px;font-weight:750;transition:.18s}
    .tab-button:hover{border-color:#d8a7ff;background:#352047}.tab-button.active{color:#fff;border-color:#e0b3ff;background:linear-gradient(120deg,#7025a4,#a333c8);box-shadow:0 0 22px #a855f755}
    .tab-page{display:none;min-height:55vh;border-radius:18px;padding:clamp(10px,2vw,18px);border:1px solid #65447d;background:linear-gradient(145deg,#28143b99,#120b1dcc)}
    .tab-page.active{display:block}.tab-page[data-theme="main"]{background:linear-gradient(145deg,#29133d,#120b1d)}.tab-page[data-theme="auto"]{background:linear-gradient(145deg,#20103b,#100b20)}.tab-page[data-theme="manage"]{background:linear-gradient(145deg,#351044,#160b20)}.tab-page[data-theme="calendar"]{background:linear-gradient(145deg,#28104b,#110b20)}.tab-page[data-theme="insights"]{background:linear-gradient(145deg,#321044,#150b20)}.tab-page[data-theme="indicators"]{background:linear-gradient(145deg,#21134a,#100b20)}.tab-page[data-theme="archive"]{background:linear-gradient(145deg,#35123e,#140b20)}
    .section-heading{font-size:19px;font-weight:850;letter-spacing:-.02em;margin:2px 0 14px}.subtabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.subtab{border:1px solid #8054a0;background:#241333;color:#e9d5ff;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:700}.subtab.active{background:#8b35c9;color:white}
    .placeholder-card{border:1px dashed #8054a0;background:#160d22aa;border-radius:14px;padding:18px;color:#d7c3e8}
    @media(max-width:900px){.dashboard-grid{grid-template-columns:1fr!important}.header-wrap{align-items:flex-start;flex-direction:column}.tab-button{padding:10px 12px}}
    @media(max-width:900px){.dashboard-grid{grid-template-columns:1fr!important}.header-wrap{align-items:flex-start;flex-direction:column}}
